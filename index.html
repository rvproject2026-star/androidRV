<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Kontrol Sewa - androidRV</title>
    
    <!-- SDK Firebase JS (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #050505;
            color: #00ff66;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 380px;
            background: #0a0a0a;
            border: 2px solid #00ff66;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            padding: 25px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #00ff66;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 20px;
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 10px;
        }
        .info-panel {
            background: #111;
            border: 1px solid #005522;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .label { color: #88ffbb; }
        .value { color: #00ff66; font-weight: bold; }
        
        .status-box {
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .status-unlocked { background-color: #00220a; color: #00ff66; border: 1px solid #00ff66; }
        .status-locked { background-color: #330000; color: #ff3333; border: 1px solid #ff3333; }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: 1px solid;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-lock { background-color: #220000; color: #ff3333; border-color: #ff3333; }
        .btn-lock:hover { background-color: #ff3333; color: #000; }
        
        .btn-unlock { background-color: #00220a; color: #00ff66; border-color: #00ff66; }
        .btn-unlock:hover { background-color: #00ff66; color: #000; }

        .btn-logout { background-color: #111; color: #88ffbb; border-color: #005522; margin-top: 15px; }
        .btn-logout:hover { background-color: #005522; color: #fff; }

        .log-box {
            margin-top: 15px;
            background: #000;
            border: 1px dashed #005522;
            padding: 8px;
            font-size: 11px;
            color: #00aa44;
            height: 50px;
            overflow-y: auto;
        }

        .input-field {
            width: 100%;
            background: #000;
            border: 1px solid #005522;
            color: #00ff66;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
        .input-field:focus {
            border-color: #00ff66;
            outline: none;
        }
        .btn-login {
            background-color: #00220a;
            color: #00ff66;
            border-color: #00ff66;
        }
        .btn-login:hover {
            background-color: #00ff66;
            color: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Form Login Admin -->
    <div id="login-section" style="display: none;">
        <h2>// Autentikasi</h2>
        <div style="margin-bottom: 15px; font-size: 12px; color: #88ffbb;">Masukkan kredensial akses admin:</div>
        <input type="email" id="login-email" class="input-field" placeholder="Email Admin">
        <input type="password" id="login-password" class="input-field" placeholder="Password">
        <button class="btn btn-login" onclick="handleLogin()">[>] MASUK TERMINAL</button>
        <div id="login-error" style="color: #ff3333; font-size: 11px; margin-top: 10px; text-align: center;"></div>
    </div>

    <!-- Panel Kontrol Utama -->
    <div id="control-section" style="display: none;">
        <h2>// Terminal Kontrol</h2>
        
        <div class="info-panel">
            <div class="info-row">
                <span class="label">Target ID:</span>
                <span class="value" id="device-id">hp_sewa_01</span>
            </div>
            <div class="info-row">
                <span class="label">Koneksi DB:</span>
                <span class="value" style="color: #00ff66;">ONLINE</span>
            </div>
            <div class="info-row">
                <span class="label">Aksesibilitas:</span>
                <span class="value" style="color: #ffcc00;">TERMONITOR</span>
            </div>
        </div>

        <div id="status-display" class="status-box status-unlocked">
            STATUS: MEMUAT...
        </div>

        <button class="btn btn-lock" onclick="setStatus('EXPIRE_AND_LOCK')">[!] KUNCI PERANGKAT</button>
        <button class="btn btn-unlock" onclick="setStatus('UNLOCKED')">[✓] BUKA KUNCI PERANGKAT</button>
        <button class="btn btn-logout" onclick="handleLogout()">[x] KELUAR SESI</button>

        <div class="log-box" id="log-terminal">
            > Sistem siap mengirim perintah sinyal...
        </div>
    </div>
</div>

<script>
    // Konfigurasi Firebase Anda
    const firebaseConfig = {
        apiKey: "AIzaSyCxyL4ENMpTFUtZ-vYsH14PoFQiY8I-Bb8",
        authDomain: "androidrv-c40ca.firebaseapp.com",
        databaseURL: "https://androidrv-c40ca-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "androidrv-c40ca",
        storageBucket: "androidrv-c40ca.firebasestorage.app",
        messagingSenderId: "738598900581",
        appId: "1:738598900581:web:22d42c59f2bb0d5050878c",
        measurementId: "G-0C2WJ21YXP"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();
    
    const deviceId = "hp_sewa_01";
    const statusRef = database.ref("devices/" + deviceId + "/status");
    const logTerminal = document.getElementById("log-terminal");

    const loginSection = document.getElementById("login-section");
    const controlSection = document.getElementById("control-section");
    const loginError = document.getElementById("login-error");

    // Pantau status login secara realtime
    auth.onAuthStateChanged((user) => {
        if (user) {
            loginSection.style.display = "none";
            controlSection.style.display = "block";
            initControlPanel();
        } else {
            loginSection.style.display = "block";
            controlSection.style.display = "none";
        }
    });

    // Fungsi tombol login
    function handleLogin() {
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;
        loginError.innerText = "";

        auth.signInWithEmailAndPassword(email, password)
            .catch((error) => {
                loginError.innerText = "Gagal: " + error.message;
            });
    }

    // Fungsi tombol logout
    function handleLogout() {
        auth.signOut().catch((error) => {
            alert("Gagal keluar: " + error.message);
        });
    }

    // Inisialisasi Database Listener setelah berhasil login
    function initControlPanel() {
        statusRef.on("value", (snapshot) => {
            const status = snapshot.val();
            const statusDisplay = document.getElementById("status-display");

            if (status === "EXPIRE_AND_LOCK") {
                statusDisplay.innerText = "STATUS: TERKUNCI (ACTIVE)";
                statusDisplay.className = "status-box status-locked";
                logTerminal.innerHTML += "<br>> Perintah KUNCI aktif di database.";
            } else if (status === "UNLOCKED") {
                statusDisplay.innerText = "STATUS: NORMAL (UNLOCKED)";
                statusDisplay.className = "status-box status-unlocked";
                logTerminal.innerHTML += "<br>> Perintah BUKA KUNCI aktif.";
            } else {
                statusDisplay.innerText = "STATUS: TIDAK DIKETAHUI";
            }
            logTerminal.scrollTop = logTerminal.scrollHeight;
        });
    }

    // Fungsi untuk mengubah status lewat tombol website
    function setStatus(newStatus) {
        logTerminal.innerHTML += `<br>> Mengirim sinyal: ${newStatus}...`;
        statusRef.set(newStatus)
            .then(() => {
                logTerminal.innerHTML += `<br>> Berhasil dikirim ke server.`;
            })
            .catch((error) => {
                logTerminal.innerHTML += `<br>> Gagal: ${error.message}`;
            });
        logTerminal.scrollTop = logTerminal.scrollHeight;
    }
</script>

</body>
</html>
