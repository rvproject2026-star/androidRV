<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Kontrol Sewa - androidRV</title>
    
    <!-- SDK Firebase JS (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #050505;
            color: #00ff66;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 380px;
            background: #0a0a0a;
            border: 2px solid #00ff66;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            padding: 25px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #00ff66;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 20px;
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 10px;
        }
        .info-panel {
            background: #111;
            border: 1px solid #005522;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .label { color: #88ffbb; }
        .value { color: #00ff66; font-weight: bold; }
        
        .status-box {
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .status-unlocked { background-color: #00220a; color: #00ff66; border: 1px solid #00ff66; }
        .status-locked { background-color: #330000; color: #ff3333; border: 1px solid #ff3333; }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: 1px solid;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-lock { background-color: #220000; color: #ff3333; border-color: #ff3333; }
        .btn-lock:hover { background-color: #ff3333; color: #000; }
        
        .btn-unlock { background-color: #00220a; color: #00ff66; border-color: #00ff66; }
        .btn-unlock:hover { background-color: #00ff66; color: #000; }

        .log-box {
            margin-top: 15px;
            background: #000;
            border: 1px dashed #005522;
            padding: 8px;
            font-size: 11px;
            color: #00aa44;
            height: 50px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>// كن فيكن</h2>
    
    <div class="info-panel">
        <div class="info-row">
            <span class="label">Target ID:</span>
            <span class="value" id="device-id">hp_sewa_01</span>
        </div>
        <div class="info-row">
            <span class="label">Koneksi DB:</span>
            <span class="value" style="color: #00ff66;">ONLINE</span>
        </div>
        <div class="info-row">
            <span class="label">Aksesibilitas:</span>
            <span class="value" style="color: #ffcc00;">TERMONITOR</span>
        </div>
    </div>

    <div id="status-display" class="status-box status-unlocked">
        STATUS: MEMUAT...
    </div>

    <button class="btn btn-lock" onclick="setStatus('EXPIRE_AND_LOCK')">[!] EKSEKUSI</button>
    <button class="btn btn-unlock" onclick="setStatus('UNLOCKED')">[✓] BUKA KUNCI PERANGKAT</button>

    <div class="log-box" id="log-terminal">
        > Sistem siap mengirim perintah sinyal...
    </div>
</div>

<script>
    // Konfigurasi Firebase Anda
    const firebaseConfig = {
        apiKey: "AIzaSyCxyL4ENMpTFUtZ-vYsH14PoFQiY8I-Bb8",
        authDomain: "androidrv-c40ca.firebaseapp.com",
        databaseURL: "https://androidrv-c40ca-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "androidrv-c40ca",
        storageBucket: "androidrv-c40ca.firebasestorage.app",
        messagingSenderId: "738598900581",
        appId: "1:738598900581:web:22d42c59f2bb0d5050878c",
        measurementId: "G-0C2WJ21YXP"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    const deviceId = "hp_sewa_01";
    const statusRef = database.ref("devices/" + deviceId + "/status");
    const logTerminal = document.getElementById("log-terminal");

    // Pantau perubahan status secara realtime
    statusRef.on("value", (snapshot) => {
        const status = snapshot.val();
        const statusDisplay = document.getElementById("status-display");

        if (status === "EXPIRE_AND_LOCK") {
            statusDisplay.innerText = "STATUS: TERKUNCI (ACTIVE)";
            statusDisplay.className = "status-box status-locked";
            logTerminal.innerHTML += "<br>> Perintah KUNCI aktif di database.";
        } else if (status === "UNLOCKED") {
            statusDisplay.innerText = "STATUS: NORMAL (UNLOCKED)";
            statusDisplay.className = "status-box status-unlocked";
            logTerminal.innerHTML += "<br>> Perintah BUKA KUNCI aktif.";
        } else {
            statusDisplay.innerText = "STATUS: TIDAK DIKETAHUI";
        }
        logTerminal.scrollTop = logTerminal.scrollHeight;
    });

    // Fungsi untuk mengubah status lewat tombol website
    function setStatus(newStatus) {
        logTerminal.innerHTML += `<br>> Mengirim sinyal: ${newStatus}...`;
        statusRef.set(newStatus)
            .then(() => {
                logTerminal.innerHTML += `<br>> Berhasil dikirim ke server.`;
            })
            .catch((error) => {
                logTerminal.innerHTML += `<br>> Gagal: ${error.message}`;
            });
        logTerminal.scrollTop = logTerminal.scrollHeight;
    }
</script>

</body>
</html>
