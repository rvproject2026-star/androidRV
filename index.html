<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol Sewa HP - androidRV</title>
    
    <!-- SDK Firebase JS (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
        h2 { margin-bottom: 5px; color: #333; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .status-box {
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 25px;
            font-size: 16px;
        }
        .status-unlocked { background-color: #d4edda; color: #155724; }
        .status-locked { background-color: #f8d7da; color: #721c24; }
        .btn {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-lock { background-color: #dc3545; color: white; }
        .btn-lock:hover { background-color: #c82333; }
        .btn-unlock { background-color: #28a745; color: white; }
        .btn-unlock:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="card">
    <h2>Remote Kontrol HP</h2>
    <p>ID Perangkat: <strong id="device-id">hp_sewa_01</strong></p>

    <div id="status-display" class="status-box status-unlocked">
        Status: Memuat...
    </div>

    <button class="btn btn-lock" onclick="setStatus('EXPIRE_AND_LOCK')">KUNCI HP (Video ON)</button>
    <button class="btn btn-unlock" onclick="setStatus('UNLOCKED')">BUKA KUNCI HP</button>
</div>

<script>
    // Konfigurasi Firebase Anda
    const firebaseConfig = {
        apiKey: "AIzaSyCxyL4ENMpTFUtZ-vYsH14PoFQiY8I-Bb8",
        authDomain: "androidrv-c40ca.firebaseapp.com",
        databaseURL: "https://androidrv-c40ca-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "androidrv-c40ca",
        storageBucket: "androidrv-c40ca.firebasestorage.app",
        messagingSenderId: "738598900581",
        appId: "1:738598900581:web:22d42c59f2bb0d5050878c",
        measurementId: "G-0C2WJ21YXP"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    const deviceId = "hp_sewa_01";
    const statusRef = database.ref("devices/" + deviceId + "/status");

    // Pantau perubahan status secara realtime
    statusRef.on("value", (snapshot) => {
        const status = snapshot.val();
        const statusDisplay = document.getElementById("status-display");

        if (status === "EXPIRE_AND_LOCK") {
            statusDisplay.innerText = "Status: TERKUNCI (Kiosk Active)";
            statusDisplay.className = "status-box status-locked";
        } else if (status === "UNLOCKED") {
            statusDisplay.innerText = "Status: TERBUKA (Normal)";
            statusDisplay.className = "status-box status-unlocked";
        } else {
            statusDisplay.innerText = "Status: Belum Diatur";
        }
    });

    // Fungsi untuk mengubah status lewat tombol website
    function setStatus(newStatus) {
        statusRef.set(newStatus)
            .then(() => {
                console.log("Status berhasil diperbarui ke: " + newStatus);
            })
            .catch((error) => {
                alert("Gagal memperbarui status: " + error.message);
            });
    }
</script>

</body>
</html>
